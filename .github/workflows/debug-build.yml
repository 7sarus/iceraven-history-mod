name: Build Debug APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix android-components TOML paths
        run: |
          sed -i 's/\.\.\/\.\.\/\.\.\/\.\.\/\.\.\/gradle\/libs.versions.toml/\.\.\/\.\.\/\.\.\/gradle\/libs.versions.toml/g' android-components/plugins/config/settings.gradle.kts android-components/plugins/publicsuffixlist/settings.gradle.kts android-components/settings.gradle android-components/plugins/dependencies/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iceraven-debug-apk
          path: app/build/outputs/apk/debug/*.apk
